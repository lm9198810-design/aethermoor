name: Aethermoor smoke tests
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free smoke tests
        run: node tests/smoke.test.cjs
